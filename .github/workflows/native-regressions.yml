name: Native runtime regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CACHE_SCOPE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && 'main' || format('sha-{0}', github.sha) }}
  CACHE_WRITE: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

jobs:
  native:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Select cache registry
        id: registry
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR for build cache
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare the isolated native test target
        run: |
          mkdir -p test/.artifacts/native
          cat Dockerfile.fedora-44 test/native/Dockerfile.fragment > test/.artifacts/native/Dockerfile
      - name: Cache source-built native dependencies before compiling tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fedora-44
          target: vnc-build
          platforms: linux/amd64
          outputs: type=cacheonly
          cache-from: |
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-native-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-native-main
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-fedora-44-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-fedora-44-main
            type=gha,scope=plasma6-native
          cache-to: ${{ env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:buildcache-native-{1},mode=max', steps.registry.outputs.image, env.CACHE_SCOPE) || '' }}
      - name: Build the matching native SDK and actual upstream objects
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/.artifacts/native/Dockerfile
          target: native-tests
          platforms: linux/amd64
          load: true
          tags: plasma6:native-tests
          cache-from: |
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-native-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-native-main
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-fedora-44-${{ env.CACHE_SCOPE }}
            type=registry,ref=${{ steps.registry.outputs.image }}:buildcache-fedora-44-main
            type=gha,scope=plasma6-native
          cache-to: ${{ env.CACHE_WRITE == 'true' && format('type=registry,ref={0}:buildcache-native-{1},mode=max', steps.registry.outputs.image, env.CACHE_SCOPE) || '' }}
      - name: Run every native case without the host display or network
        run: |
          docker run --rm --init --network none \
            --mount "type=bind,source=$PWD/test/.artifacts/native,target=/results" plasma6:native-tests
      - name: Check every native compiler input with its matching SDK
        run: |
          python3 test/native/sdk-inputs.py plasma6:native-tests test/.artifacts/native/compiler-lint
      - name: Retain the native plan, JUnit and complete output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-native
          path: test/.artifacts/native/
          if-no-files-found: error
          retention-days: 14
