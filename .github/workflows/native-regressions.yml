name: Native runtime regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Prepare the isolated native test target
        run: |
          mkdir -p test/.artifacts/native
          cat Dockerfile.fedora-44 test/native/Dockerfile.fragment > test/.artifacts/native/Dockerfile
      - name: Build the matching native SDK and actual upstream objects
        uses: docker/build-push-action@v7
        with:
          context: .
          file: test/.artifacts/native/Dockerfile
          target: native-tests
          platforms: linux/amd64
          load: true
          tags: plasma6:native-tests
          cache-from: type=gha,scope=plasma6-native
          cache-to: type=gha,scope=plasma6-native,mode=max
      - name: Run every native case without the host display or network
        run: |
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/test/.artifacts/native,target=/results" plasma6:native-tests
      - name: Check every native compiler input with its matching SDK
        run: |
          python3 test/native/sdk-inputs.py plasma6:native-tests test/.artifacts/native/compiler-lint
      - name: Retain the native plan, JUnit and complete output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: validation-native
          path: test/.artifacts/native/
          if-no-files-found: error
          retention-days: 14
